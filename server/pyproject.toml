[project]
name = "tts-server"
version = "0.1.0"
description = "Local TTS server for the Firefox read-aloud extension (mlx-audio on Apple Silicon)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-audio",
    "fastapi",
    "uvicorn",
    "numpy",
    "misaki[en]>=0.9.4",
]

[project.scripts]
tts-server = "tts_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_server"]
