<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div id="connecting" class="muted">Checking TTS server…</div>

    <div id="server-down" hidden>
      <p class="err-title">TTS server is not running</p>
      <p>Start it in a terminal with:</p>
      <code id="start-cmd">uv --directory ~/firefox-tts-2/server run tts-server</code>
      <button id="retry">Retry</button>
    </div>

    <div id="main" hidden>
      <div id="title" class="muted"></div>
      <div id="preview"></div>
      <div id="transport">
        <button id="back" title="Previous sentence">⏮</button>
        <button id="playpause" title="Play / pause">▶</button>
        <button id="stop" title="Stop">⏹</button>
        <button id="fwd" title="Next sentence">⏭</button>
      </div>
      <div id="status" class="muted"></div>
      <label class="row">
        <span>Speed</span>
        <input type="range" id="speed" min="0.5" max="3" step="0.05">
        <span id="speedval" class="mono"></span>
      </label>
      <label class="row">
        <span>Voice</span>
        <select id="voice"></select>
      </label>
      <div id="error" hidden></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
